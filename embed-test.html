<!doctype html>
<html lang="zh">
<!--
  Local test page mimicking Bear Blog structure.
  Tests embed.js rendering into a blog-like page layout.
  Run with: wrangler dev, then open http://localhost:8787/embed-test.html
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5">
  <title>Journal – Embed Test (Bear Blog Style)</title>
  <style>
    /* =========================================
       Simplified Bear Blog theme for testing
       Mirrors l3on.site CSS variables & layout
    ========================================= */
    @font-face {
      font-family: "Twemoji Country Flags";
      unicode-range: U+1F1E6-1F1FF;
      src: url("https://cdn.jsdelivr.net/npm/country-flag-emoji-polyfill@0.1/dist/TwemojiCountryFlags.woff2") format("woff2");
      font-display: swap;
    }

    :root {
      color-scheme: light dark;
      --width: 52rem;
      --header-height: 2.1875rem;
      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2rem;
      --font-main: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
      --font-monospace: "IBM Plex Mono", ui-monospace, Menlo, Monaco, monospace;
      --text-base: 1rem;
      --text-sm: 0.875rem;
      --text-xs: 0.8rem;
      --h1-size: 1.8rem;

      /* Light Theme */
      --background-color: #f0f0f0;
      --dot-color: #cacaca;
      --text-color: #333;
      --sec-text-color: #808080;
      --heading-color: #333;
      --link-color: #0077cc;
      --border-color: #999;
      --code-background-color: #f0f0f0;
      --button-bg: #ddd;
      --button-hover: #ccc;
      --meta-bg: #fafafa;
      --highlight-bg: #ffffff;
      --header-bg: var(--background-color);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background-color: #111;
        --dot-color: #333;
        --text-color: #ddd;
        --sec-text-color: #808080;
        --heading-color: #fff;
        --link-color: #66b3ff;
        --border-color: #555;
        --code-background-color: #2a2a2a;
        --button-bg: #333;
        --button-hover: #444;
        --meta-bg: #212121;
        --highlight-bg: #1a1a1a;
        --header-bg: #1a1a1a;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      height: 100%;
      overflow: hidden;
      scrollbar-width: thin;
      scrollbar-color: var(--border-color) var(--background-color);
    }

    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      font-family: var(--font-main);
      font-size: var(--text-base);
      line-height: 1.5;
      color: var(--text-color);
      background-color: var(--background-color);
      background-image: radial-gradient(circle, var(--dot-color) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    header, footer {
      flex-shrink: 0;
      width: 100%;
      min-height: var(--header-height);
      padding: 0.3125em 0.625em;
      background-color: var(--header-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
    }

    header { border-bottom: 1px solid var(--border-color); }
    footer {
      border-top: 1px solid var(--border-color);
      font-size: var(--text-sm);
    }

    .title { display: block; margin: 0; text-decoration: none; color: inherit; }
    .title h1 { margin: 0; font-size: 1.125rem; font-weight: 600; white-space: nowrap; }

    nav { margin: 0; }
    nav p { margin: 0; display: flex; gap: 8px; }
    nav a {
      display: inline-flex; align-items: center; justify-content: center;
      height: 1.7em; min-width: max-content; padding: 0 0.4em;
      background-color: var(--button-bg); border: 1px solid var(--border-color);
      color: var(--text-color); text-decoration: none;
      font-family: var(--font-main); font-size: var(--text-sm);
      white-space: nowrap; transition: background-color 0.2s ease; cursor: pointer;
    }
    nav a:hover { background-color: var(--button-hover); }

    main {
      flex-grow: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 2em max(calc(50% - var(--width) / 2), 1rem);
      width: 100%;
      margin: 0;
      position: relative;
      -webkit-overflow-scrolling: touch;
      max-width: 100vw;
    }

    main > :first-child { margin-top: 0; }

    h1 { font-size: var(--h1-size); color: var(--heading-color); }

    a { color: var(--sec-text-color); text-decoration: none; }
    a:hover { color: var(--link-color); }

    hr { margin: 1em 0; border: none; border-top: 1px solid var(--border-color); }

    /* =========================================
       Journal Embed Styles
       (same CSS that will go into Bear Blog)
    ========================================= */
    #arena-journal-feed .thought-container {
      margin-bottom: 1.5em;
    }

    #arena-journal-feed .thought-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 0.5em;
      gap: 1em;
    }

    #arena-journal-feed .thought-date {
      font-family: var(--font-monospace);
      font-size: var(--text-xs);
      color: var(--sec-text-color);
      flex-shrink: 0;
    }

    #arena-journal-feed .thought-date a {
      color: inherit;
      text-decoration: none;
    }
    #arena-journal-feed .thought-date a:hover {
      text-decoration: underline;
    }

    #arena-journal-feed .thought-title {
      font-family: var(--font-monospace);
      font-size: var(--text-xs);
      color: var(--sec-text-color);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      flex: 0 1 auto;
      max-width: calc(100% - 2em);
      position: relative;
    }

    #arena-journal-feed .thought-title[data-tooltip-id] {
      cursor: help;
    }

    #arena-journal-feed .thought-content {
      background-color: var(--highlight-bg);
      border: 1px solid var(--border-color);
      padding: 1em;
      word-wrap: break-word;
      line-height: 1.8;
    }

    #arena-journal-feed .thought-content > *:first-child { margin-top: 0; }
    #arena-journal-feed .thought-content > *:last-child { margin-bottom: 0; }

    #arena-journal-feed .thought-content img {
      max-width: 100%;
      width: 100%;
      height: auto;
      display: block;
    }

    /* Link blocks */
    #arena-journal-feed .link-container {
      display: flex;
      gap: 1em;
      align-items: flex-start;
    }

    #arena-journal-feed .link-thumb {
      flex-shrink: 0;
      width: 100px;
      height: 100px;
      object-fit: cover;
      border: 1px solid var(--border-color);
    }

    #arena-journal-feed .link-main {
      flex-grow: 1;
      min-width: 0;
    }

    #arena-journal-feed .link-description > p { margin: 0; }

    #arena-journal-feed .link-button {
      display: inline-block;
      background-color: var(--button-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      font-family: var(--font-monospace);
      font-size: var(--text-xs);
      padding: 4px 10px;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }
    #arena-journal-feed .link-button:hover {
      background-color: var(--button-hover);
      text-decoration: none;
    }

    /* Embeds */
    #arena-journal-feed .embed-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      max-width: 100%;
    }

    #arena-journal-feed .embed-container iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: 0;
    }

    /* Tooltip */
    #arena-journal-feed .tooltip-content {
      position: fixed;
      background-color: var(--highlight-bg);
      border: 1px solid var(--border-color);
      padding: 0.75em;
      font-size: var(--text-xs);
      max-width: 300px;
      width: max-content;
      z-index: 1000;
      line-height: 1.4;
      word-wrap: break-word;
    }
    #arena-journal-feed .tooltip-content p { margin: 0.25em 0; }

    /* Loader & Error */
    #arena-journal-feed .embed-loader {
      text-align: center;
      padding: 1.5em 0;
      font-size: var(--text-sm);
      color: var(--sec-text-color);
    }

    #arena-journal-feed .embed-loader-error {
      color: #d26464;
    }

    #arena-journal-feed .embed-error {
      text-align: center;
      padding: 3em 1em;
      font-size: var(--text-sm);
      color: #d26464;
      line-height: 1.6;
    }
    #arena-journal-feed .embed-error a {
      color: var(--link-color);
    }

    /* Typography in blocks */
    #arena-journal-feed blockquote {
      border-left: 2px solid var(--border-color);
      padding-left: 0.8em;
      margin-left: 0;
      color: var(--sec-text-color);
    }

    #arena-journal-feed hr {
      border: 0;
      border-top: 1px solid var(--border-color);
      margin: 0.8em 0;
    }

    #arena-journal-feed code {
      font-family: var(--font-monospace);
      font-size: 0.85em;
      background-color: var(--code-background-color);
      border: 1px solid var(--border-color);
      padding: 0.2em 0.4em;
    }

    #arena-journal-feed strong {
      color: var(--heading-color);
    }

    #arena-journal-feed p {
      margin: 1em 0;
      line-height: 1.8;
    }
  </style>
</head>

<body>
  <header>
    <a class="title" href="/">
      <h1>l3on.site</h1>
    </a>
    <nav>
      <p><a href="/archive">文章</a> <a href="/journal">日志</a> <a href="/links">友邻</a> <a href="/about">关于</a></p>
    </nav>
  </header>

  <main>
    <h1>Journal</h1>
    <p>A feed of things in my mind, powered by <a href="https://www.are.na/lok/journaling-and-healing">are.na</a>.</p>
    <hr>

    <!-- The embed mount point — this is what goes in the Bear Blog post body -->
    <div id="arena-journal-feed" data-channel="journaling-and-healing" data-page-size="20">
      <p style="text-align:center; color: var(--sec-text-color);">Loading journal...</p>
    </div>
  </main>

  <footer>
    <span>Powered by Bear ʕ•ᴥ•ʔ</span>
  </footer>

  <!-- Load the embed script -->
  <script src="/embed.js"></script>
</body>
</html>
